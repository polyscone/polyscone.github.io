<li{{with .Params.index_id}} id="{{.}}"{{end}}>
	<a href="{{.RelPermalink}}">
		{{with resources.Get (printf "images/videos/playlists/%s.png" .Params.index_id)}}
			{{$thumbnail := .Resize "480x webp"}}
			<img src="{{$thumbnail.RelPermalink}}" width="{{$thumbnail.Width}}" height="{{$thumbnail.Height}}" alt="" loading="lazy" decoding="async">
		{{end}}
		<div class="video-entries__details">
			{{if .Params.parent_series}}
				<h3>{{.Title}}</h3>
			{{else}}
				<h2>{{.Title}}</h2>
			{{end}}
		</div>
	</a>
</li>
