{{$page := .page}}
{{$series := .series}}

<li>
	<h2>{{index $series "title"}}</h2>
	<p>{{index $series "description"}}</p>

	{{with index $series "video_groups"}}
		<div class="video-groups">
			{{range .}}
				{{partial "video-table.html" (dict "data" (index $series "data") "group" . "page" $page)}}
			{{end}}
		</div>
	{{end}}
</li>
